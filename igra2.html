<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pogodi kut</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <main class="kartica">
        <p class="oznaka">// IGRA 02</p>

        <h1>POGODI KUT</h1>

        <p class="opis">
            Procijeni koliko stupnjeva ima prikazani kut.
        </p>

        <div class="kut">
            <div class="linija prva"></div>
            <div class="linija druga" id="drugaLinija"></div>
        </div>

        <div class="unos">
            <input
                type="number"
                id="odgovor"
                min="10"
                max="180"
                placeholder="0°"
            >
        </div>

        <div class="gumbi">
            <button onclick="provjeri()">PROVJERI</button>
            <button onclick="noviKut()">NOVI KUT</button>
        </div>

        <p id="poruka"></p>

        <a href="index.html" class="povratak">
            ← NAZAD NA IGRE
        </a>
    </main>

    <script src="script2.js"></script>
</body>
</html>
