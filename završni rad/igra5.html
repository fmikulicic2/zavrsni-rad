<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Sudoku</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style5.css">
</head>

<body>
    <main class="kartica">
        <p class="oznaka">// IGRA 05</p>

        <h1>MINI SUDOKU</h1>

        <p class="opis">
            Ispuni prazna polja brojevima od 1 do 4.
        </p>

        <div class="sudoku">
            <input value="1" disabled>
            <input id="p1" type="number" min="1" max="4">
            <input id="p2" type="number" min="1" max="4">
            <input value="4" disabled>

            <input id="p3" type="number" min="1" max="4">
            <input value="4" disabled>
            <input value="2" disabled>
            <input id="p4" type="number" min="1" max="4">

            <input id="p5" type="number" min="1" max="4">
            <input value="3" disabled>
            <input value="1" disabled>
            <input id="p6" type="number" min="1" max="4">

            <input value="2" disabled>
            <input id="p7" type="number" min="1" max="4">
            <input id="p8" type="number" min="1" max="4">
            <input value="3" disabled>
        </div>

        <div class="gumbi">
            <button onclick="provjeri()">PROVJERI</button>
            <button onclick="ocisti()">OČISTI</button>
        </div>

        <p id="poruka"></p>

        <a href="index.html" class="povratak">
            ← NAZAD NA IGRE
        </a>
    </main>

    <script src="script5.js"></script>
</body>
</html>
