<body>
    <main class="kartica">
        <p class="oznaka">// IGRA 07</p>

        <h1>BORBA ŠTAPIĆIMA</h1>

        <p class="opis">
            Na stolu je 15 štapića. Uzmi 1, 2 ili 3.
            Tko uzme posljednji štapić – gubi.
        </p>

        <div class="stanje">
            <p>PREOSTALO ŠTAPIĆA</p>
            <span id="brojStapica">15</span>
        </div>

        <div class="odabir">
            <button onclick="uzmi(1)">UZMI 1</button>
            <button onclick="uzmi(2)">UZMI 2</button>
            <button onclick="uzmi(3)">UZMI 3</button>
        </div>

        <button class="nova-igra" onclick="novaIgra()">
            NOVA IGRA
        </button>

        <p id="poruka"></p>

        <a href="index.html" class="povratak">
            ← NAZAD NA IGRE
        </a>
    </main>
