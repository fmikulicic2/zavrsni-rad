<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pogodi postotak</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	
    <link rel="stylesheet" href="style4.css">
</head>

<body>
    <main class="kartica">
        <p class="oznaka">// IGRA 04</p>

        <h1>POGODI POSTOTAK</h1>

        <p class="opis">
            Procijeni koliko je spremnik napunjen.
        </p>

        <div class="spremnik">
            <div id="tekucina"></div>
        </div>

        <div class="procjena">
            <p>TVOJA PROCJENA</p>
            <span id="vrijednost">50</span><span class="postotak">%</span>
        </div>

        <input
            type="range"
            id="slider"
            min="0"
            max="100"
            value="50"
            oninput="prikaziVrijednost()"
        >

        <div class="gumbi">
            <button onclick="provjeri()">PROVJERI</button>
            <button onclick="novaIgra()">NOVI SPREMNIK</button>
        </div>

        <p id="poruka"></p>

        <a href="index.html" class="povratak">
            ← NAZAD NA IGRE
        </a>
    </main>

    <script src="script4.js"></script>
</body>
</html>
